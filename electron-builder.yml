# Single packaging pipeline (architecture §1, §4). Builds the Steam-ready Windows folder.
appId: com.deividev.martianscrapco
productName: Martian Scrap Co
copyright: Copyright © 2026 David Seco Diaz
artifactName: MartianScrapCo-${version}-${os}-${arch}.${ext}

directories:
  output: release

# Allowlist: only compiled renderer, compiled Electron code and package.json enter app.asar.
# Sources, docs, references, tests, tools, saves and source art are excluded by omission.
files:
  - dist/**/*
  - dist-electron/electron/**/*
  - package.json
  - '!**/*.map'
  # steamworks.js (MSC-026) is the only runtime dependency; ship only its loader and the win64 binary + DLL.
  - '!**/node_modules/{@types,undici-types}/**'
  - '!**/node_modules/steamworks.js/dist/{linux64,osx}/**'
  - '!**/node_modules/steamworks.js/**/*.{d.ts,lib,md}'

# Native modules (.node, Steam DLLs) must load from disk, not from inside the asar archive.
asar: true
asarUnpack:
  - native/**
  - '**/*.node'
  - '**/node_modules/steamworks.js/dist/win64/**'

# Also place steam_api64.dll next to the executable (co-op guide §3.3): a missing DLL silently means "no Steam".
extraFiles:
  - from: node_modules/steamworks.js/dist/win64/steam_api64.dll
    to: steam_api64.dll

electronLanguages:
  - en-US

# Harden the shipped binary: no ELECTRON_RUN_AS_NODE, no NODE_OPTIONS, no --inspect,
# load only from app.asar and verify its integrity.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: dir
      arch: x64
  # Zero-spend: no code-signing certificate is assumed (architecture §4).
  signAndEditExecutable: true
